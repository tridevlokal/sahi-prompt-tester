# fly.io config for the AI Riya voice agent.
# Deploy: fly launch --copy-config --no-deploy   (first time, adopts this file)
#         fly secrets set GOOGLE_API_KEY=... ELEVENLABS_API_KEY=...
#         fly deploy --remote-only
app = "ai-riya-tester"
primary_region = "sin"          # Singapore — bom (Mumbai) had no machine capacity;
                                # sin is close to India, ElevenLabs still uses India residency URL

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Kept warm (min 1, no auto-stop) so the shared test link works instantly for
  # whoever you send it to — no cold start, no on-demand capacity gamble. Costs a
  # little while running; kill the app after testing to stop billing.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # WebSocket voice calls are long-lived — allow generous concurrency headroom.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"                 # onnxruntime + Silero VAD + models
